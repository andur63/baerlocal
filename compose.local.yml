# Vollständiger lokaler BärGPT-Stack (Frontend + Hono-Backend + Lokales Supabase + LM Studio)
#
# Starten (setzt laufendes Docker Desktop & LM Studio Server auf Port 1234 voraus):
#   docker compose -f compose.local.yml up --build --force-recreate
#
# Endpunkte nach dem Start:
#   - BärGPT Chat (Frontend): http://localhost:5173
#   - BärGPT API (Backend):   http://localhost:3000
#   - Supabase API (Kong):    http://127.0.0.1:54321
#   - Mailpit (OTP-E-Mails):  http://localhost:54324

name: baergpt-local

services:
  db:
    container_name: baergpt-local-db
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    ports:
      - "127.0.0.1:54322:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: postgres
      POSTGRES_PASSWORD: postgres
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      JWT_EXP: 3600
    volumes:
      - local-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -h localhost && psql -U supabase_admin -d postgres -h localhost -tAc \"ALTER ROLE postgres WITH SUPERUSER PASSWORD 'postgres'; ALTER ROLE supabase_admin WITH SUPERUSER PASSWORD 'postgres'; ALTER ROLE supabase_auth_admin WITH SUPERUSER PASSWORD 'postgres'; ALTER ROLE authenticator WITH PASSWORD 'postgres'; ALTER ROLE supabase_storage_admin WITH SUPERUSER PASSWORD 'postgres'; ALTER DATABASE postgres SET search_path TO public, extensions; ALTER ROLE supabase_auth_admin SET search_path TO auth, public, extensions; ALTER ROLE supabase_storage_admin SET search_path TO storage, public, extensions; CREATE SCHEMA IF NOT EXISTS _realtime AUTHORIZATION supabase_admin;\" >/dev/null",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal",
      ]

  mailpit:
    container_name: baergpt-local-mailpit
    image: axllent/mailpit:v1.22
    restart: unless-stopped
    ports:
      - "127.0.0.1:54324:8025"

  auth:
    container_name: baergpt-local-auth
    image: supabase/gotrue:v2.180.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_URI_ALLOW_LIST: http://localhost:5173/confirm-otp/
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@ts.berlin
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_SENDER_NAME: BärGPT Lokal
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_SMTP_MAX_FREQUENCY: 1ms
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
      GOTRUE_MAILER_OTP_EXP: 1800
      GOTRUE_MAILER_OTP_LENGTH: 10
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health",
        ]
      start_period: 30s
      interval: 3s
      timeout: 5s
      retries: 20

  rest:
    container_name: baergpt-local-rest
    image: postgrest/postgrest:v13.0.8
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    command: ["postgrest"]

  realtime:
    container_name: realtime-dev.supabase-realtime
    image: supabase/realtime:v2.51.11
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: postgres
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime, public, extensions"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      SECRET_KEY_BASE: UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"

  storage:
    container_name: baergpt-local-storage
    image: supabase/storage-api:v1.28.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      DATABASE_URL: postgres://supabase_storage_admin:postgres@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
    volumes:
      - local-storage-data:/var/lib/storage
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:5000/status",
        ]
      start_period: 30s
      interval: 3s
      timeout: 5s
      retries: 20

  kong:
    container_name: baergpt-local-kong
    image: kong:2.8.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:54321:8000"
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
      storage:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./infra/local-supabase/kong.yml:/home/kong/kong.yml:ro

  db-init:
    container_name: baergpt-local-db-init
    image: supabase/postgres:15.8.1.085
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
      kong:
        condition: service_started
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./apps/backend/supabase/migrations:/migrations:ro
      - ./infra/local-supabase/init-baergpt.sh:/init-baergpt.sh:ro
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "tr -d '\\r' < /init-baergpt.sh > /tmp/init.sh && chmod +x /tmp/init.sh && /tmp/init.sh",
      ]

  backend:
    container_name: baergpt-backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/backend/.env:/app/apps/backend/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      LOCAL_LLM_ENABLED: "true"
      LLM_BASE_URL: http://host.docker.internal:1234/v1
    command:
      [
        "sh",
        "-c",
        "node --env-file=.env -e \"const{createClient}=require('@supabase/supabase-js');(async()=>{const s=createClient(process.env.SUPABASE_URL,process.env.SUPABASE_SERVICE_ROLE_KEY);const email='local.admin@ts.berlin';const{data}=await s.auth.admin.listUsers();let u=data?.users?.find(x=>x.email===email);if(u){await s.auth.admin.updateUserById(u.id,{password:'LocalAdmin123!',email_confirm:true});}else{const res=await s.auth.admin.createUser({email,password:'LocalAdmin123!',email_confirm:true,user_metadata:{first_name:'Local',last_name:'Admin'}});u=res.data?.user;}if(u){await s.from('application_admins').upsert([{user_id:u.id}]);console.log('Seeded local admin:',email);}})().catch(e=>console.warn('Seed warning:',e.message));\" && node --env-file=.env dist/src/index.js",
      ]

  frontend:
    container_name: baergpt-frontend
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  local-db-data:
  local-storage-data:
